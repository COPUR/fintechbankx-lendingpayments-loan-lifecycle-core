// =================================================================
// LOAN INFRASTRUCTURE MODULE
// =================================================================
// Infrastructure implementations: repositories, external services, adapters
// Implements ports defined in domain and application layers
// =================================================================

apply plugin: 'jacoco'

description = 'Loan Infrastructure - Persistence and external service implementations'

dependencies {
    // Application Layer
    api project(':loan-application')
    
    // Persistence: own schema sc_ln_loan_lifecycle, Flyway migrations in src/main/resources/db/migration
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.postgresql:postgresql'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'
    
    // Inbound HTTP and outbound customer-profile client
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
    
    // Messaging (outbox relay) and metrics
    implementation 'org.springframework.kafka:spring-kafka'
    implementation 'io.micrometer:micrometer-core'
    
    // Testing
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'
    testImplementation 'org.springframework.kafka:spring-kafka-test'
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.4.1'
}

jacoco {
    toolVersion = "0.8.14"
}

def loanInfrastructureCoverageIncludes = [
    'com/bank/loan/infrastructure/external/**',
    'com/bank/loan/infrastructure/outbox/**',
    'com/bank/loan/infrastructure/persistence/**',
    'com/bank/loan/infrastructure/web/**'
]

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect { dir ->
            fileTree(dir: dir, include: loanInfrastructureCoverageIncludes)
        }))
    }
}

jacocoTestCoverageVerification {
    dependsOn jacocoTestReport
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect { dir ->
            fileTree(dir: dir, include: loanInfrastructureCoverageIncludes)
        }))
    }
    violationRules {
        rule {
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.85
            }
        }
    }
}

check.dependsOn jacocoTestCoverageVerification
