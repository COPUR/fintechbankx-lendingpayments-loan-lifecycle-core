# Defaults are production-shaped (multi-replica, spread across zones).
# Override per environment with values-<env>.yaml.

image:
  repository: ""   # e.g. <account>.dkr.ecr.<region>.amazonaws.com/fintechbankx/loan-lifecycle-service
  tag: ""          # immutable tag (git SHA); never "latest"
  pullPolicy: IfNotPresent

replicaCount: 3

serviceAccount:
  name: loan-lifecycle-service
  # IAM role from deploy/terraform output workload_role_arn (IRSA).
  roleArn: ""

# Platform contract pod labels. The chart adds app.kubernetes.io/name and
# app (= the service account name), version (= image.tag) and
# sidecar.istio.io/inject (label and annotation) itself.
podLabels:
  app.kubernetes.io/part-of: fintechbankx-lending
  fintechbankx.io/service-id: svc-ln-loan-lifecycle
  fintechbankx.io/app: app-ln-loan-lifecycle

service:
  port: 8080
  managementPort: 8081

# Memory request = limit: the JVM sizes its heap from the limit
# (MaxRAMPercentage), so the pod always gets what the heap will use.
resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    memory: 1Gi

# CPU only: a JVM does not give memory back, so a memory target would only
# ever scale up.
autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 12
  targetCPUUtilizationPercentage: 65

# Owning squad, rendered as the common label fintechbankx.io/squad on every
# object (platform review round 2: lending for loan).
squad: lending

# NetworkPolicy belongs to the mesh repo (platform review round 2, cicd-templates
# 1dd1138), so the chart renders none by default. Opt-in only for a cluster the
# mesh repo does not cover yet; it never admits a /0 CIDR, only namespaces.
networkPolicy:
  enabled: false
  # 8080: the ingress gateway and these caller namespaces
  ingressNamespace: istio-ingress
  callerNamespaces:
    - payments
  # Scrape: the observability PodMonitor reads Istio's merged metrics on 15020
  # (app 8081 and Envoy), so 15020 and 8081 from this namespace only.
  observabilityNamespace: observability

# Metrics: the observability repo's PodMonitor fintechbankx-services is the
# single scrape path (pod label fintechbankx.io/service-id plus the
# prometheus.io annotations). This chart ships no ServiceMonitor (cicd-templates
# 0f86859).

podDisruptionBudget:
  minAvailable: 2

# Non-secret runtime settings, rendered into a ConfigMap. Values marked
# REQUIRED have no default; the chart fails to render without them. There is
# no extraEnv, envFrom or javaToolOptions: every pod setting goes through
# config, and the ExternalSecret keys are fixed in the templates. The chart
# refuses to render (round 6, guardrail 4a) through the reference guard
# vendored unchanged from cicd-templates a4f0072 (templates/_fbx_helpers.tpl,
# fbx.guard; README "Chart guard") plus this chart's own rules
# (templates/_helpers.tpl loan.guardValues), whatever the case or spelling of
# a key (Spring's relaxed binding: '.', '-', '_', '[]', indexed _0):
#   - DB_URL that is not a PostgreSQL JDBC URL with exactly one sslmode=verify-full
#     and exactly one sslrootcert=<databaseCa bundle>, or that carries
#     sslfactory, sslfactoryarg, sslhostnameverifier, sslpasswordcallback,
#     service, a percent-encoded '=' or '&', an upper-case SSLMODE, a TLS key
#     before the '?', or a '${' / '$(' reference; DB_URL in another spelling
#     (db.url, dbUrl); any other value that is a PostgreSQL JDBC URL gets the
#     same parse;
#   - spring.datasource.*, spring.flyway.*, spring.liquibase.*, spring.r2dbc.*
#     (except SPRING_DATASOURCE_USERNAME and SPRING_DATASOURCE_PASSWORD),
#     spring.application.json, *jdbc_url*, *ssl_factory*, *ssl_hostname_verifier*,
#     *ssl_password_callback*, *ssl_root_cert*, *ssl_mode* (DB_SSL_ROOT_CERT is
#     rendered by the chart);
#   - spring.config.* (Spring configuration is never redirected from values);
#   - spring.profiles.* (the profile is kafka.profile);
#   - spring.ssl.* and *ssl_bundle* (trust anchors come from the mounted bundles);
#   - fintechbankx.tls.* (the startup TLS assertion is never switched off);
#   - spring.kafka.properties.* (this chart's rule); a *security_protocol key
#     must hold SASL_SSL with kafka.profile kafka-msk or SSL with kafka-strimzi,
#     an *endpoint_identification_algorithm key must hold https;
#   - JAVA_TOOL_OPTIONS, JDK_JAVA_OPTIONS or _JAVA_OPTIONS whose value mentions
#     datasource, flyway, liquibase, r2dbc, jdbc, ssl, application.json,
#     spring.config, spring.profiles, fintechbankx.tls, security.protocol,
#     endpoint.identification, java.security.properties, jdk.tls, hostname
#     verification or kafka (this chart's rule), contains '$(' or '${' or a
#     non-ASCII character, or reads options from a file ('@' argument file,
#     -XX:VMOptionsFile, -XX:Flags);
#   - a config key that is not a ConfigMap key ([-._a-zA-Z0-9]+). Every key and
#     value the templates interpolate is quoted, so a value never adds a key.
config:
  # REQUIRED (deploy/terraform output jdbc_url). Must verify the server
  # certificate against the mounted RDS CA bundle (databaseCa below), e.g.
  # jdbc:postgresql://<aurora-writer-endpoint>:5432/db_ln_loan_lifecycle_<env>?sslmode=verify-full&sslrootcert=/etc/fintechbankx/rds-ca/global-bundle.pem
  DB_URL: ""
  # Runtime role (DML only, granted by V4); its password comes from the
  # db-app secret. The schema owner is used only by the migration Job.
  DB_USERNAME: loan_lifecycle_app
  DB_POOL_MAX: "10"
  KAFKA_BOOTSTRAP_SERVERS: ""     # REQUIRED MSK bootstrap brokers (IAM, port 9098)
  KAFKA_SECURITY_PROTOCOL: SASL_SSL  # MSK IAM auth, see application-kafka-msk.yml
  OIDC_ISSUER_URI: ""             # REQUIRED Keycloak realm issuer
  OIDC_JWK_SET_URI: ""            # REQUIRED Keycloak realm JWKS
  OIDC_TOKEN_URI: ""              # REQUIRED client-credentials token endpoint for service-to-service calls
  OIDC_AUDIENCE: svc-ln-loan-lifecycle   # tokens must carry this in aud
  SERVICE_CLIENT_ID: svc-ln-loan-lifecycle
  CUSTOMER_SERVICE_BASE_URL: ""   # REQUIRED e.g. http://customer-profile-kyc-service.customer.svc.cluster.local:8080
  # REQUIRED http or in-memory. Switch to http only after the customer
  # cutover has passed its step 5 (runbook precondition table).
  CUSTOMER_CREDIT_ADAPTER: ""
  # REQUIRED ISO 4217 currency the customer service holds credit in. No
  # default: the book's currency is a business decision, never assumed.
  CUSTOMER_CREDIT_LEDGER_CURRENCY: ""
  # Off until evt.ln.loan.v1 is in the platform catalog (runbook step 1).
  OUTBOX_RELAY_ENABLED: "false"
  # Off until the loan and payments writes cut over together (runbook step 3).
  LOAN_REPAYMENT_CONSUMER_ENABLED: "false"
  # Credit reservation recovery sweep (CreditReservationSweep; http adapter
  # only): re-drives pending releases and releases accepted reservations of
  # never-disbursed loans. Per environment it stays "false" until
  # customer-profile-kyc-core #13 (a6ebe01 or later) is deployed there
  # (runbook section 8, rollout order). The grace must outlast 3 x (1 s + 2 s)
  # or the pods do not start. One replica at a time (advisory lock).
  CREDIT_RESERVATION_SWEEP_ENABLED: "true"
  CREDIT_RESERVATION_SWEEP_INTERVAL: PT1M
  CREDIT_RESERVATION_SWEEP_GRACE: PT10M
  # A reserve sent but never answered: "false" marks it UNCONFIRMED for an
  # operator (gauge loan_credit_reservations_operator{reason="unconfirmed"}),
  # never released blind; "true" releases it by its reference. Turn it on only
  # once the environment's customer service answers an unknown reference with
  # 422 RESERVATION_NOT_FOUND (customer-profile-kyc-core #13, a6ebe01 or
  # later), after CREDIT_RESERVATION_SWEEP_ENABLED (runbook section 8).
  CREDIT_RESERVATION_SWEEP_RELEASE_UNANSWERED: "false"

# The Spring profile the pods run (rendered as SPRING_PROFILES_ACTIVE through the
# reference guard's fbx.kafkaProfile, from kafka.profile mapped onto its
# kafka.runtime msk or strimzi; config may not name one): kafka-msk (MSK, IAM
# over SASL_SSL, application-kafka-msk.yml; KAFKA_SECURITY_PROTOCOL must be
# SASL_SSL) or kafka-strimzi (in-cluster Strimzi, mutual TLS,
# application-kafka-strimzi.yml; KAFKA_SECURITY_PROTOCOL must be SSL). Nothing
# else renders: the local profile (application-local.yml) switches the startup
# TLS assertion off and exists for local runs only.
kafka:
  profile: kafka-msk

# Flyway migration step: a Helm pre-install/pre-upgrade Job running the image
# with "migrate" as the schema owner. Only this Job mounts the owner
# credential; the pods run with SPRING_FLYWAY_ENABLED=false.
migration:
  enabled: true
  # REQUIRED Secrets Manager secret <env>/loan-lifecycle-service/db-migration
  # ({"username","password"} of the schema owner; deploy/terraform output
  # migration_db_secret_name).
  remoteSecretName: ""
  # A classic (non-native) Istio sidecar keeps the Job from completing, so
  # the Job runs outside the mesh by default; it only talks to Aurora (TLS
  # verify-full). Set true once the cluster runs Istio native sidecars.
  istioSidecar: false
  backoffLimit: 1
  activeDeadlineSeconds: 600
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 512Mi

# Amazon RDS CA bundle (platform contract "Database CA bundle"): ConfigMap
# rds-ca-bundle, key global-bundle.pem, published by trust-manager into every
# service namespace. Mounted read-only so DB_URL can use sslmode=verify-full
# with sslrootcert=<mountPath>/global-bundle.pem. The chart ships no copy.
# Same shape as the shared chart's databaseCa (cicd-templates 4f0f266): mounted
# read-only at mountPath, exported as DB_SSL_ROOT_CERT, not optional (a missing
# bundle stops the pod), and a DB_URL without sslmode=verify-full fails the render.
databaseCa:
  configMapName: rds-ca-bundle
  key: global-bundle.pem
  mountPath: /etc/fintechbankx/rds-ca

# Database credential, synced from AWS Secrets Manager by External Secrets Operator.
externalSecret:
  enabled: true
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  # Keys must be <env>/loan-lifecycle-service/<name>: the platform ESO role may
  # read only secret:<env>/* (the chart refuses anything else).
  # Secrets Manager secret <env>/loan-lifecycle-service/db-app (deploy/terraform
  # output app_db_secret_name).
  remoteSecretName: ""
  # Secrets Manager secret <env>/loan-lifecycle-service/oidc-client holding this
  # service's Keycloak client secret (property client_secret), used for
  # client-credentials calls to customer.
  serviceClientSecretName: ""
  refreshInterval: 1h

topologySpread:
  maxSkew: 1
