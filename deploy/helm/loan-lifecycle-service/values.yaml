# Defaults are production-shaped (multi-replica, spread across zones).
# Override per environment with values-<env>.yaml.

image:
  repository: ""   # e.g. <account>.dkr.ecr.<region>.amazonaws.com/fintechbankx/loan-lifecycle-service
  tag: ""          # immutable tag (git SHA); never "latest"
  pullPolicy: IfNotPresent

replicaCount: 3

serviceAccount:
  name: loan-lifecycle-service
  # IAM role from deploy/terraform output workload_role_arn (IRSA).
  roleArn: ""

podLabels:
  app.kubernetes.io/part-of: fintechbankx-lending
  fintechbankx.io/service-id: svc-ln-loan-lifecycle
  sidecar.istio.io/inject: "true"

service:
  port: 8080
  managementPort: 8081

resources:
  requests:
    cpu: 500m
    memory: 768Mi
  limits:
    memory: 1Gi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 12
  targetCPUUtilizationPercentage: 65
  targetMemoryUtilizationPercentage: 80

podDisruptionBudget:
  minAvailable: 2

# Non-secret runtime settings, rendered into a ConfigMap.
config:
  DB_URL: ""                      # jdbc:postgresql://<aurora-writer-endpoint>:5432/db_ln_loan_lifecycle_<env>?sslmode=require
  DB_USERNAME: loan_lifecycle_app
  DB_POOL_MAX: "10"
  KAFKA_BOOTSTRAP_SERVERS: ""
  KAFKA_SECURITY_PROTOCOL: SASL_SSL  # MSK IAM auth, see application-aws.yml
  SPRING_PROFILES_ACTIVE: aws
  OIDC_ISSUER_URI: ""
  OIDC_JWK_SET_URI: ""
  OIDC_TOKEN_URI: ""              # client-credentials token endpoint for service-to-service calls
  SERVICE_CLIENT_ID: svc-ln-loan-lifecycle
  CUSTOMER_SERVICE_BASE_URL: http://customer-profile-kyc-service.customer.svc.cluster.local:8080
  CUSTOMER_CREDIT_LEDGER_CURRENCY: AED
  OUTBOX_RELAY_ENABLED: "true"

# Database credential, synced from AWS Secrets Manager by External Secrets Operator.
externalSecret:
  enabled: true
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  # Secrets Manager secret from deploy/terraform output app_db_secret_name.
  remoteSecretName: ""
  # Secrets Manager secret holding this service's Keycloak client secret
  # (property client_secret), used for client-credentials calls to customer.
  serviceClientSecretName: ""
  refreshInterval: 1h

topologySpread:
  maxSkew: 1
