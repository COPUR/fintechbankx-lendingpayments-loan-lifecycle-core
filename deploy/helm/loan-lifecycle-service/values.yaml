# Defaults are production-shaped (multi-replica, spread across zones).
# Override per environment with values-<env>.yaml.

image:
  repository: ""   # e.g. <account>.dkr.ecr.<region>.amazonaws.com/fintechbankx/loan-lifecycle-service
  tag: ""          # immutable tag (git SHA); never "latest"
  pullPolicy: IfNotPresent

replicaCount: 3

serviceAccount:
  name: loan-lifecycle-service
  # IAM role from deploy/terraform output workload_role_arn (IRSA).
  roleArn: ""

# Platform contract pod labels. The chart adds app.kubernetes.io/name and
# app (= the service account name), version (= image.tag) and
# sidecar.istio.io/inject (label and annotation) itself.
podLabels:
  app.kubernetes.io/part-of: fintechbankx-lending
  fintechbankx.io/service-id: svc-ln-loan-lifecycle
  fintechbankx.io/app: app-ln-loan-lifecycle

service:
  port: 8080
  managementPort: 8081

# Memory request = limit: the JVM sizes its heap from the limit
# (MaxRAMPercentage), so the pod always gets what the heap will use.
resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    memory: 1Gi

# CPU only: a JVM does not give memory back, so a memory target would only
# ever scale up.
autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 12
  targetCPUUtilizationPercentage: 65

# Who may open connections to the pods (Kubernetes NetworkPolicy; mesh ALLOW
# rules by caller principal live in the mesh repo, see README "Callers").
networkPolicy:
  enabled: true
  # 8080: the ingress gateway and these caller namespaces
  ingressNamespace: istio-ingress
  callerNamespaces:
    - payments
  # 8081 (actuator, Prometheus scrape)
  observabilityNamespace: observability

podDisruptionBudget:
  minAvailable: 2

# Non-secret runtime settings, rendered into a ConfigMap. Values marked
# REQUIRED have no default; the chart fails to render without them.
config:
  DB_URL: ""                      # REQUIRED jdbc:postgresql://<aurora-writer-endpoint>:5432/db_ln_loan_lifecycle_<env>?sslmode=require
  DB_USERNAME: loan_lifecycle_app
  DB_POOL_MAX: "10"
  KAFKA_BOOTSTRAP_SERVERS: ""     # REQUIRED MSK bootstrap brokers (IAM, port 9098)
  KAFKA_SECURITY_PROTOCOL: SASL_SSL  # MSK IAM auth, see application-kafka-msk.yml
  SPRING_PROFILES_ACTIVE: kafka-msk
  OIDC_ISSUER_URI: ""             # REQUIRED Keycloak realm issuer
  OIDC_JWK_SET_URI: ""            # REQUIRED Keycloak realm JWKS
  OIDC_TOKEN_URI: ""              # REQUIRED client-credentials token endpoint for service-to-service calls
  OIDC_AUDIENCE: svc-ln-loan-lifecycle   # tokens must carry this in aud
  SERVICE_CLIENT_ID: svc-ln-loan-lifecycle
  CUSTOMER_SERVICE_BASE_URL: ""   # REQUIRED e.g. http://customer-profile-kyc-service.customer.svc.cluster.local:8080
  # REQUIRED http or in-memory. Switch to http only after the customer
  # cutover has passed its step 4 (runbook precondition table).
  CUSTOMER_CREDIT_ADAPTER: ""
  # REQUIRED ISO 4217 currency the customer service holds credit in. No
  # default: the book's currency is a business decision, never assumed.
  CUSTOMER_CREDIT_LEDGER_CURRENCY: ""
  # Off until evt.ln.loan.* are in the platform catalog (runbook step 1).
  OUTBOX_RELAY_ENABLED: "false"
  # Off until the loan and payments writes cut over together (runbook step 3).
  LOAN_REPAYMENT_CONSUMER_ENABLED: "false"

# Database credential, synced from AWS Secrets Manager by External Secrets Operator.
externalSecret:
  enabled: true
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  # Keys must be <env>/loan-lifecycle-service/<name>: the platform ESO role may
  # read only secret:<env>/* (the chart refuses anything else).
  # Secrets Manager secret <env>/loan-lifecycle-service/db-app (deploy/terraform
  # output app_db_secret_name).
  remoteSecretName: ""
  # Secrets Manager secret <env>/loan-lifecycle-service/oidc-client holding this
  # service's Keycloak client secret (property client_secret), used for
  # client-credentials calls to customer.
  serviceClientSecretName: ""
  refreshInterval: 1h

topologySpread:
  maxSkew: 1
