{{- $required := list "DB_URL" "KAFKA_BOOTSTRAP_SERVERS" "OIDC_ISSUER_URI" "OIDC_JWK_SET_URI" "OIDC_TOKEN_URI" "CUSTOMER_SERVICE_BASE_URL" "ACCOUNTS_SERVICE_BASE_URL" "CUSTOMER_CREDIT_ADAPTER" "CUSTOMER_CREDIT_LEDGER_CURRENCY" }}
{{- range $key := $required }}
{{- $_ := required (printf "config.%s is required (no default)" $key) (index $.Values.config $key) }}
{{- end }}
{{- if not (has .Values.config.CUSTOMER_CREDIT_ADAPTER (list "http" "in-memory")) }}
{{- fail "config.CUSTOMER_CREDIT_ADAPTER must be http or in-memory" }}
{{- end }}
{{- $bookingKeys := list "LOAN_BOOKING_CURRENCY" "LOAN_RECEIVABLE_ACCOUNT_ID" "LOAN_DISBURSEMENT_CLEARING_ACCOUNT_ID" }}
{{- $bookingSet := 0 }}
{{- range $key := $bookingKeys }}
{{- if index $.Values.config $key }}{{- $bookingSet = add1 $bookingSet }}{{- end }}
{{- end }}
{{- if and (gt $bookingSet 0) (lt $bookingSet 3) }}
{{- fail "config LOAN_BOOKING_CURRENCY, LOAN_RECEIVABLE_ACCOUNT_ID and LOAN_DISBURSEMENT_CLEARING_ACCOUNT_ID must be set together: all three, or none (none refuses every booking with 422 BOOKING_NOT_CONFIGURED)" }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "loan.name" . }}
  labels:
    {{- include "loan.labels" . | nindent 4 }}
data:
  # The only profile the pods activate (fbx.kafkaProfile from kafka.profile: kafka-msk or kafka-strimzi);
  # config may not name one (loan.guardValues, called from deployment.yaml and migration-job.yaml).
  SPRING_PROFILES_ACTIVE: {{ include "loan.springProfile" . | quote }}
  {{- range $key, $value := .Values.config }}
  {{ $key | quote }}: {{ $value | quote }}
  {{- end }}
