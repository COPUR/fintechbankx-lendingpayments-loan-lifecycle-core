{{- $required := list "DB_URL" "KAFKA_BOOTSTRAP_SERVERS" "OIDC_ISSUER_URI" "OIDC_JWK_SET_URI" "OIDC_TOKEN_URI" "CUSTOMER_SERVICE_BASE_URL" "CUSTOMER_CREDIT_ADAPTER" "CUSTOMER_CREDIT_LEDGER_CURRENCY" }}
{{- range $key := $required }}
{{- $_ := required (printf "config.%s is required (no default)" $key) (index $.Values.config $key) }}
{{- end }}
{{- if not (has .Values.config.CUSTOMER_CREDIT_ADAPTER (list "http" "in-memory")) }}
{{- fail "config.CUSTOMER_CREDIT_ADAPTER must be http or in-memory" }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "loan.name" . }}
  labels:
    {{- include "loan.labels" . | nindent 4 }}
data:
  {{- range $key, $value := .Values.config }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
