{{- /* Round 6 (guardrail 4a): the vendored reference guard (fbx.guard, _fbx_helpers.tpl) plus this chart's own rules, _helpers.tpl loan.guardValues. */ -}}
{{- include "loan.guardValues" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "loan.name" . }}
  labels:
    {{- include "loan.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount | int }}
  {{- end }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "loan.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "loan.selectorLabels" . | nindent 8 }}
        app: {{ .Values.serviceAccount.name | quote }}
        version: {{ .Values.image.tag | quote }}
        sidecar.istio.io/inject: "true"
        fintechbankx.io/squad: {{ .Values.squad | quote }}
        {{- toYaml .Values.podLabels | nindent 8 }}
      annotations:
        sidecar.istio.io/inject: "true"
        # Keep the sidecar draining for longer than the app's graceful shutdown
        # (preStop 10 s + spring.lifecycle 25 s), within terminationGracePeriodSeconds.
        proxy.istio.io/config: '{"terminationDrainDuration": "55s"}'
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.service.managementPort | quote }}
        prometheus.io/path: /actuator/prometheus
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name | quote }}
      # Above the sidecar drain (55 s) so neither is killed mid-drain.
      terminationGracePeriodSeconds: 65
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: {{ .Values.topologySpread.maxSkew | int }}
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              {{- include "loan.selectorLabels" . | nindent 14 }}
        - maxSkew: {{ .Values.topologySpread.maxSkew | int }}
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "loan.selectorLabels" . | nindent 14 }}
      containers:
        - name: loan-lifecycle-service
          image: "{{ required "image.repository is required" .Values.image.repository }}:{{ required "image.tag is required" .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy | quote }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port | int }}
            - name: management
              containerPort: {{ .Values.service.managementPort | int }}
          env:
            # Path of the mounted RDS CA bundle (cicd-templates 4f0f266).
            - name: DB_SSL_ROOT_CERT
              value: {{ printf "%s/%s" (trimSuffix "/" .Values.databaseCa.mountPath) .Values.databaseCa.key | quote }}
            # Migrations run only in the pre-install/pre-upgrade Job as the
            # schema owner; the pods hold the runtime role and never migrate.
            - name: SPRING_FLYWAY_ENABLED
              value: "false"
          envFrom:
            - configMapRef:
                name: {{ include "loan.name" . }}
            {{- if .Values.externalSecret.enabled }}
            - secretRef:
                name: {{ include "loan.secretName" . }}
            {{- end }}
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: management
            periodSeconds: 5
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 10"]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: database-ca
              mountPath: {{ .Values.databaseCa.mountPath | quote }}
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: database-ca
          configMap:
            name: {{ .Values.databaseCa.configMapName | quote }}
            items:
              - key: {{ .Values.databaseCa.key | quote }}
                path: {{ .Values.databaseCa.key | quote }}
