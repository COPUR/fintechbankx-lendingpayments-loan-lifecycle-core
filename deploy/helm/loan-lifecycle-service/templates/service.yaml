apiVersion: v1
kind: Service
metadata:
  name: {{ include "loan.name" . }}
  labels:
    {{- include "loan.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "loan.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
    - name: http-management
      port: {{ .Values.service.managementPort }}
      targetPort: management
