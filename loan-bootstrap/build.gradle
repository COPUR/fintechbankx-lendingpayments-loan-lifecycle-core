// =================================================================
// LOAN BOOTSTRAP MODULE
// =================================================================
// Runnable Spring Boot service (svc-ln-loan-lifecycle). Wires the domain,
// application and infrastructure modules; holds runtime configuration only.
// =================================================================

apply plugin: 'org.springframework.boot'

description = 'Loan Bootstrap - deployable svc-ln-loan-lifecycle service'

dependencies {
    implementation project(':loan-infrastructure')

    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
    implementation 'org.springframework.kafka:spring-kafka'
    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
    // W3C trace context (traceparent) in and out, traceId/spanId in the MDC;
    // the outbox stores the traceparent and the relay forwards it to Kafka.
    implementation 'io.micrometer:micrometer-tracing-bridge-otel'
    runtimeOnly 'org.postgresql:postgresql'
    // MSK IAM client auth, used by the kafka-msk profile (platform contract)
    runtimeOnly 'software.amazon.msk:aws-msk-iam-auth:2.2.0'
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'
    // DatabaseMigrationIT migrates step by step (target) to test a data migration.
    testImplementation 'org.flywaydb:flyway-core'
}

springBoot {
    mainClass = 'com.bank.loan.LoanLifecycleApplication'
    buildInfo()
}

bootJar {
    archiveFileName = 'loan-lifecycle-service.jar'
}

jar {
    enabled = false
}
