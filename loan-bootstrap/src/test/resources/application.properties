# Test resources of the bootstrap module: the integration tests boot the whole
# service against a plain local PostgreSQL (TEST_DB_URL or Testcontainers) with
# a mocked Kafka client, so the startup TLS assertion (TlsEnforcement,
# fintechbankx.tls.enforce in application.yml) is switched off here only.
# .properties beside the main application.yml: both load, and this one wins.
fintechbankx.tls.enforce=false
